<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mama's Digital Khata</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

  <header class="bg-indigo-600 text-white p-4 shadow-lg sticky top-0 z-10">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold">🛒 Mama's Digital Khata</h1>
        <p class="text-sm text-indigo-100">Borrowing Record Management System</p>
      </div>

      <div class="text-right">
        <p class="text-sm">Total Customers</p>
        <h2 id="customerCount" class="text-2xl font-bold">0</h2>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 grid lg:grid-cols-3 gap-6 mt-4">

    <!-- Add Customer -->
    <section class="bg-white rounded-2xl shadow-lg p-5">
      <h2 class="text-xl font-bold mb-4 text-indigo-600">➕ Add Customer</h2>

      <div class="space-y-3">
        <input id="customerName" type="text" placeholder="Customer Name"
          class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" />

        <input id="customerPhone" type="text" placeholder="Phone Number"
          class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" />

        <button onclick="addCustomer()"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-semibold transition">
          Add Customer
        </button>
      </div>
    </section>

    <!-- Add Borrowing -->
    <section class="bg-white rounded-2xl shadow-lg p-5">
      <h2 class="text-xl font-bold mb-4 text-orange-600">💸 Add Borrowing</h2>

      <div class="space-y-3">
        <select id="borrowCustomer"
          class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500">
        </select>

        <input id="borrowReason" type="text" placeholder="Items Bought"
          class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500" />

        <input id="borrowAmount" type="number" placeholder="Amount"
          class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500" />

        <button onclick="addBorrowing()"
          class="w-full bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-xl font-semibold transition">
          Save Borrowing
        </button>
      </div>
    </section>

    <!-- Add Payment -->
    <section class="bg-white rounded-2xl shadow-lg p-5">
      <h2 class="text-xl font-bold mb-4 text-green-600">💰 Add Payment</h2>

      <div class="space-y-3">
        <select id="paymentCustomer"
          class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">
        </select>

        <input id="paymentAmount" type="number" placeholder="Payment Amount"
          class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500" />

        <button onclick="addPayment()"
          class="w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-xl font-semibold transition">
          Save Payment
        </button>
      </div>
    </section>
  </main>

  <!-- Dashboard Cards -->
  <section class="max-w-6xl mx-auto p-4 grid md:grid-cols-3 gap-5">

    <div class="bg-white rounded-2xl shadow-lg p-5">
      <p class="text-gray-500">Total Borrowings</p>
      <h2 id="totalBorrowing" class="text-3xl font-bold text-orange-500 mt-2">₹0</h2>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-5">
      <p class="text-gray-500">Total Payments</p>
      <h2 id="totalPayments" class="text-3xl font-bold text-green-500 mt-2">₹0</h2>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-5">
      <p class="text-gray-500">Pending Balance</p>
      <h2 id="pendingBalance" class="text-3xl font-bold text-red-500 mt-2">₹0</h2>
    </div>
  </section>

  <!-- Customer List -->
  <section class="max-w-6xl mx-auto p-4 pb-10">
    <div class="bg-white rounded-2xl shadow-lg p-5 overflow-x-auto">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold text-indigo-600">📋 Customer Records</h2>

        <input id="searchInput" onkeyup="renderCustomers()" type="text" placeholder="Search customer..."
          class="border rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <table class="w-full border-collapse">
        <thead>
          <tr class="bg-indigo-100 text-left">
            <th class="p-3">Name</th>
            <th class="p-3">Phone</th>
            <th class="p-3">Balance</th>
            <th class="p-3">History</th>
            <th class="p-3">Action</th>
          </tr>
        </thead>

        <tbody id="customerTable"></tbody>
      </table>
    </div>
  </section>

  <script>
    let customers = JSON.parse(localStorage.getItem('customers')) || [];

    function saveData() {
      localStorage.setItem('customers', JSON.stringify(customers));
    }

    function addCustomer() {
      const name = document.getElementById('customerName').value.trim();
      const phone = document.getElementById('customerPhone').value.trim();

      if (!name || !phone) {
        alert('Please fill all fields');
        return;
      }

      customers.push({
        id: Date.now(),
        name,
        phone,
        balance: 0,
        history: []
      });

      saveData();
      renderCustomers();
      updateDropdowns();

      document.getElementById('customerName').value = '';
      document.getElementById('customerPhone').value = '';
    }

    function updateDropdowns() {
      const borrowSelect = document.getElementById('borrowCustomer');
      const paymentSelect = document.getElementById('paymentCustomer');

      borrowSelect.innerHTML = '';
      paymentSelect.innerHTML = '';

      customers.forEach(customer => {
        const option1 = document.createElement('option');
        option1.value = customer.id;
        option1.textContent = customer.name;

        const option2 = document.createElement('option');
        option2.value = customer.id;
        option2.textContent = customer.name;

        borrowSelect.appendChild(option1);
        paymentSelect.appendChild(option2);
      });
    }

    function addBorrowing() {
      const customerId = Number(document.getElementById('borrowCustomer').value);
      const reason = document.getElementById('borrowReason').value.trim();
      const amount = Number(document.getElementById('borrowAmount').value);

      if (!reason || !amount) {
        alert('Please fill all fields');
        return;
      }

      const customer = customers.find(c => c.id === customerId);

      customer.balance += amount;

      customer.history.push({
        type: 'Borrowed',
        reason,
        amount,
        date: new Date().toLocaleString()
      });

      saveData();
      renderCustomers();

      document.getElementById('borrowReason').value = '';
      document.getElementById('borrowAmount').value = '';
    }

    function addPayment() {
      const customerId = Number(document.getElementById('paymentCustomer').value);
      const amount = Number(document.getElementById('paymentAmount').value);

      if (!amount) {
        alert('Please enter payment amount');
        return;
      }

      const customer = customers.find(c => c.id === customerId);

      customer.balance -= amount;

      customer.history.push({
        type: 'Payment',
        reason: 'Paid Amount',
        amount,
        date: new Date().toLocaleString()
      });

      saveData();
      renderCustomers();

      document.getElementById('paymentAmount').value = '';
    }

    function deleteCustomer(id) {
      if (!confirm('Delete this customer?')) return;

      customers = customers.filter(customer => customer.id !== id);

      saveData();
      renderCustomers();
      updateDropdowns();
    }

    function renderCustomers() {
      const table = document.getElementById('customerTable');
      const search = document.getElementById('searchInput').value.toLowerCase();

      table.innerHTML = '';

      let totalBorrowing = 0;
      let totalPayments = 0;
      let pendingBalance = 0;

      customers
        .filter(customer => customer.name.toLowerCase().includes(search))
        .forEach(customer => {
          pendingBalance += customer.balance;

          customer.history.forEach(item => {
            if (item.type === 'Borrowed') totalBorrowing += item.amount;
            if (item.type === 'Payment') totalPayments += item.amount;
          });

          const row = document.createElement('tr');
          row.className = 'border-b';

          row.innerHTML = `
            <td class="p-3 font-semibold">${customer.name}</td>
            <td class="p-3">${customer.phone}</td>
            <td class="p-3 font-bold ${customer.balance > 0 ? 'text-red-500' : 'text-green-600'}">
              ₹${customer.balance}
            </td>
            <td class="p-3">
              <details>
                <summary class="cursor-pointer text-indigo-600 font-semibold">View</summary>
                <div class="mt-2 space-y-2 max-h-48 overflow-y-auto">
                  ${customer.history.map(item => `
                    <div class="border rounded-xl p-2 text-sm bg-gray-50">
                      <p><strong>${item.type}</strong> - ₹${item.amount}</p>
                      <p>${item.reason}</p>
                      <p class="text-gray-500 text-xs">${item.date}</p>
                    </div>
                  `).join('')}
                </div>
              </details>
            </td>
            <td class="p-3">
              <button onclick="deleteCustomer(${customer.id})"
                class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg">
                Delete
              </button>
            </td>
          `;

          table.appendChild(row);
        });

      document.getElementById('customerCount').textContent = customers.length;
      document.getElementById('totalBorrowing').textContent = `₹${totalBorrowing}`;
      document.getElementById('totalPayments').textContent = `₹${totalPayments}`;
      document.getElementById('pendingBalance').textContent = `₹${pendingBalance}`;
    }

    updateDropdowns();
    renderCustomers();
  </script>
</body>
</html>

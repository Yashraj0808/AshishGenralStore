<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grocery Borrowing Records</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
    h1 { text-align: center; color: #2c3e50; }
    .form-section, .records-section { margin: 20px auto; max-width: 600px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    label { display: block; margin-top: 10px; }
    input, button { padding: 8px; margin-top: 5px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background: #2c3e50; color: #fff; }
  </style>
</head>
<body>
  <h1>Borrowing Records - Mama's Grocery</h1>

  <!-- Customer Borrowing Form -->
  <div class="form-section">
    <h2>Add Borrowing Entry</h2>
    <label>Customer Name:</label>
    <input type="text" id="customerName" required>
    
    <label>Item:</label>
    <input type="text" id="item" required>
    
    <label>Amount (₹):</label>
    <input type="number" id="amount" required>
    
    <label>Date:</label>
    <input type="date" id="date" required>
    
    <button onclick="addRecord()">Add Record</button>
  </div>

  <!-- Records Table -->
  <div class="records-section">
    <h2>Borrowing Records</h2>
    <table id="recordsTable">
      <thead>
        <tr>
          <th>Customer</th>
          <th>Item</th>
          <th>Amount (₹)</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    function addRecord() {
      const name = document.getElementById('customerName').value;
      const item = document.getElementById('item').value;
      const amount = document.getElementById('amount').value;
      const date = document.getElementById('date').value;

      if (!name || !item || !amount || !date) {
        alert("Please fill all fields!");
        return;
      }

      const table = document.getElementById('recordsTable').getElementsByTagName('tbody')[0];
      const newRow = table.insertRow();

      newRow.insertCell(0).innerText = name;
      newRow.insertCell(1).innerText = item;
      newRow.insertCell(2).innerText = amount;
      newRow.insertCell(3).innerText = date;

      // Clear form
      document.getElementById('customerName').value = "";
      document.getElementById('item').value = "";
      document.getElementById('amount').value = "";
      document.getElementById('date').value = "";
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mama's Digital Khata</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen pb-10">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">🛒 Mama's Grocery Digital Ledger</h1>
        <p class="text-xs text-indigo-200 mt-1">0% Paper • 100% Digital • Zero Errors</p>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Column 1 & 2: Main Operations -->
        <div class="md:col-span-2 space-y-6">
            
            <!-- Quick Action: Add Customer -->
            <section class="bg-white p-4 rounded-xl shadow">
                <h2 class="text-lg font-bold text-gray-800 mb-3">➕ New Customer</h2>
                <form id="customerForm" class="flex flex-col sm:flex-row gap-2">
                    <input type="text" id="custName" placeholder="Customer Name" required class="flex-1 border p-2 rounded focus:outline-indigo-500">
                    <input type="tel" id="custPhone" placeholder="WhatsApp (with country code)" required class="flex-1 border p-2 rounded focus:outline-indigo-500">
                    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 font-semibold">Add</button>
                </form>
            </section>

            <!-- Main Log: Record Credit/Payment -->
            <section class="bg-white p-4 rounded-xl shadow">
                <h2 class="text-lg font-bold text-gray-800 mb-3">📝 Record Transaction</h2>
                <form id="txForm" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Select Customer</label>
                        <select id="txCustSelect" required class="w-full border p-2 rounded focus:outline-indigo-500"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Amount (₹)</label>
                        <input type="number" id="txAmount" min="1" placeholder="Enter Amount" required class="w-full border p-2 rounded focus:outline-indigo-500">
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Item Details / Remarks</label>
                        <input type="text" id="txRemarks" placeholder="e.g., 2kg Sugar, 1L Oil" required class="w-full border p-2 rounded focus:outline-indigo-500">
                    </div>
                    <div class="sm:col-span-2 flex gap-2 pt-2">
                        <button type="button" onclick="handleTransaction('credit')" class="flex-1 bg-red-500 text-white py-2.5 rounded font-bold hover:bg-red-600 transition shadow">
                            🔴 Give Credit (Udhaar)
                        </button>
                        <button type="button" onclick="handleTransaction('payment')" class="flex-1 bg-green-500 text-white py-2.5 rounded font-bold hover:bg-green-600 transition shadow">
                            🟢 Received Payment
                        </button>
                    </div>
                </form>
            </section>
        </div>

        <!-- Column 3: Summary Dashboard -->
        <div class="space-y-6">
            <section class="bg-indigo-900 text-white p-5 rounded-xl shadow flex flex-col justify-between">
                <div>
                    <h3 class="text-sm font-semibold opacity-75">Total Market Outstanding</h3>
                    <p class="text-3xl font-black mt-1" id="totalOutstanding">₹0.00</p>
                </div>
                <div class="mt-4 pt-4 border-t border-indigo-800 text-xs opacity-70">
                    Calculated automatically to prevent human errors.
                </div>
            </section>
        </div>

        <!-- Full Width: Customer Directory -->
        <div class="md:col-span-3">
            <section class="bg-white p-4 rounded-xl shadow overflow-hidden">
                <h2 class="text-lg font-bold text-gray-800 mb-3">👥 Customer Ledger Directory</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100 text-gray-600 text-sm font-semibold border-b">
                                <th class="p-3">Customer</th>
                                <th class="p-3">Current Balance</th>
                                <th class="p-3 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="customerTableBody" class="divide-y text-gray-700">
                            <!-- Injected by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <!-- Simple Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg hidden transform translate-y-10 transition duration-300"></div>

    <script>
        // Database Initialization
        let storeData = JSON.parse(localStorage.getItem('mamaKhata')) || { customers: [] };

        // Save Data Helper
        function saveData() {
            localStorage.setItem('mamaKhata', JSON.stringify(storeData));
            renderDashboard();
        }

        // Show Quick Toast Notification
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('hidden', 'translate-y-10');
            setTimeout(() => {
                toast.classList.add('hidden', 'translate-y-10');
            }, 3000);
        }

        // Add Customer Form Submit
        document.getElementById('customerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim().replace(/\D/g,'');

            if (storeData.customers.some(c => c.phone === phone)) {
                showToast("❌ Phone number already exists!");
                return;
            }

            storeData.customers.push({ name, phone, balance: 0 });
            saveData();
            this.reset();
            showToast(`✅ ${name} added successfully!`);
        });

        // Handle Transactions (Credit or Payment)
        function handleTransaction(type) {
            const select = document.getElementById('txCustSelect');
            const amountInput = document.getElementById('txAmount');
            const remarksInput = document.getElementById('txRemarks');

            const customerIndex = select.value;
            const amount = parseFloat(amountInput.value);
            const remarks = remarksInput.value.trim();

            if (customerIndex === "" || isNaN(amount) || amount <= 0 || remarks === "") {
                showToast("❌ Please fill out all fields correctly.");
                return;
            }

            const customer = storeData.customers[customerIndex];
            
            if (type === 'credit') {
                customer.balance += amount;
            } else if (type === 'payment') {
                customer.balance -= amount;
            }

            saveData();
            
            // Generate automated receipt message link
            const txTypeWord = type === 'credit' ? "added credit (Udhaar)" : "received payment";
            const currentBalWord = customer.balance >= 0 ? `Total outstanding balance: ₹${customer.balance}` : `Advance balance: ₹${Math.abs(customer.balance)}`;
            const message = `Hello ${customer.name}, a transaction of ₹${amount} for "${remarks}" has been recorded at our store. ${currentBalWord}. Thank you!`;
            
            // Trigger automatic free notification window
            window.open(`https://wa.me{customer.phone}?text=${encodeURIComponent(message)}`, '_blank');

            // Reset inputs
            amountInput.value = '';
            remarksInput.value = '';
            showToast("📊 Balance updated!");
        }

        // Render Interface Updates
        function renderDashboard() {
            const select = document.getElementById('txCustSelect');
            const tableBody = document.getElementById('customerTableBody');
            const totalOutstandingDisplay = document.getElementById('totalOutstanding');

            // Reset UI components
            select.innerHTML = '<option value="" disabled selected>Choose customer...</option>';
            tableBody.innerHTML = '';
            let totalMarketDebt = 0;

            if (storeData.customers.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-400 text-sm">No customer records found. Add one above!</td></tr>`;
            }

            storeData.customers.forEach((customer, index) => {
                // Keep running total of market debt
                if (customer.balance > 0) totalMarketDebt += customer.balance;

                // Populate Dropdown
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = `${customer.name} (${customer.phone})`;
                select.appendChild(opt);

                // Populate Table Row
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition";

                tr.innerHTML = `
                    <td class="p-3">
                        <div class="font-semibold">${customer.name}</div>
                        <div class="text-xs text-gray-500 mt-1">${customer.phone}</div>
                    </td>
                    <td class="p-3">
                        <span class="${customer.balance > 0 ? 'text-red-600' : customer.balance < 0 ? 'text-green-600' : 'text-gray-700'} font-semibold">
                            ₹${customer.balance.toFixed(2)}
                        </span>
                    </td>
                    <td class="p-3 text-right">
                        <button onclick="fillTransactionForm(${index})" class="text-indigo-600 hover:text-indigo-800 text-sm font-semibold">
                            Record
                        </button>
                    </td>
                `;

                tableBody.appendChild(tr);
            });

            totalOutstandingDisplay.textContent = `₹${totalMarketDebt.toFixed(2)}`;
        }

        function fillTransactionForm(index) {
            const select = document.getElementById('txCustSelect');
            select.value = index;
            showToast('Customer selected for transaction.');
        }

        // Initial render
        renderDashboard();
    </script>
</body>
</html>
